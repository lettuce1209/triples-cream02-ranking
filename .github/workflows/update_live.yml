name: Cream02 即時排行榜更新（先測試再擴大）

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "test = 只測 2 位；all = 更新 24 位"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - all

permissions:
  contents: read

# 避免上一輪尚未結束時，下一輪持續堆積或覆蓋資料。
concurrency:
  group: cream02-live-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # 初期保守設定：每次最多 2 位同時抓取；實測並確認來源允許後才能提高。
      max-parallel: 2
      matrix:
        member: ${{ fromJSON(inputs.scope == 'all' && '["SeoYeon","HyeRin","JiWoo","ChaeYeon","YooYeon","SooMin","NaKyoung","YuBin","Kaede","DaHyun","Kotone","YeonJi","Nien","SoHyun","Xinyu","Mayu","Lynn","JooBin","HaYeon","ShiOn","ChaeWon","Sullin","SeoAh","JiYeon"]' || '["SeoYeon","Mayu"]') }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 更新並立即發布這一位成員
        env:
          LIVE_API_URL: ${{ secrets.LIVE_API_URL }}
          LIVE_UPLOAD_TOKEN: ${{ secrets.LIVE_UPLOAD_TOKEN }}
        run: python scripts/publish_one.py --member "${{ matrix.member }}"

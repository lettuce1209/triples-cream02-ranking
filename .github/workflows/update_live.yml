name: Cream02 即時排行榜更新（24 位每 5 分鐘）

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "test = 只測 2 位；all = 更新全部 24 位"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - all
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

# 排程每輪都更新 24 位；上一輪若未完成，避免兩輪同時覆寫同一位成員。
# GitHub 可能延遲或略過排程；這不是精準每 5 分鐘完成的保證。
concurrency:
  group: cream02-live-refresh-${{ github.event_name == 'schedule' && 'schedule' || github.run_id }}
  cancel-in-progress: false

jobs:
  choose:
    runs-on: ubuntu-latest
    outputs:
      members: ${{ steps.pick.outputs.members }}
    steps:
      - name: 決定本次更新成員
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          names = [
              "SeoYeon", "HyeRin", "JiWoo", "ChaeYeon", "YooYeon", "SooMin",
              "NaKyoung", "YuBin", "Kaede", "DaHyun", "Kotone", "YeonJi",
              "Nien", "SoHyun", "Xinyu", "Mayu", "Lynn", "JooBin",
              "HaYeon", "ShiOn", "ChaeWon", "Sullin", "SeoAh", "JiYeon",
          ]
          if os.environ["EVENT_NAME"] == "schedule" or os.environ.get("SCOPE") == "all":
              members = names
          else:
              members = ["SeoYeon", "Mayu"]
          print("members=" + json.dumps(members))
          PY

  update:
    needs: choose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        member: ${{ fromJSON(needs.choose.outputs.members) }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 更新並立即發布這一位成員
        env:
          LIVE_API_URL: ${{ secrets.LIVE_API_URL }}
          LIVE_UPLOAD_TOKEN: ${{ secrets.LIVE_UPLOAD_TOKEN }}
        run: python scripts/publish_one.py --member "${{ matrix.member }}"

name: 更新持有排行榜並發布網站

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      member:
        description: "要更新哪位成員？輸入 all 更新全部，或輸入 Mayu 等成員名稱"
        required: false
        default: "all"
        type: string
  schedule:
    # 每小時的 02、07、12……57 分執行，間隔 5 分鐘（UTC）。
    # 避開整點尖峰，但 GitHub 不保證準時，可能延遲或跳過。
    - cron: "2-59/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-ranking
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 決定本次更新成員
        id: choose
        if: github.event_name != 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MEMBER: ${{ inputs.member || 'all' }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            MEMBER=$(python -c 'import os; names = "SeoYeon HyeRin JiWoo ChaeYeon YooYeon SooMin NaKyoung YuBin Kaede DaHyun Kotone YeonJi Nien SoHyun Xinyu Mayu Lynn JooBin HaYeon ShiOn ChaeWon Sullin SeoAh JiYeon".split(); print(names[(int(os.environ["GITHUB_RUN_NUMBER"])-1) % len(names)])')
          else
            MEMBER="$INPUT_MEMBER"
          fi
          echo "member=$MEMBER" >> "$GITHUB_OUTPUT"
          echo "本次更新成員：$MEMBER"

      - name: 讀取 objekt.top 及統計持有套數
        id: fetch
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          MEMBER: ${{ steps.choose.outputs.member }}
        run: python scripts/update_rankings.py --member "$MEMBER"

      - name: 儲存本次更新的排行榜
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/rankings.json
          if ! git diff --cached --quiet; then
            git commit -m "自動更新 Cream02 First 排行榜"
            git push
          else
            echo "排行榜資料沒有變更"
          fi

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: 發布公開網站
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 資料更新失敗時顯示紅色狀態
        if: github.event_name != 'push' && steps.fetch.outcome == 'failure'
        run: |
          echo "資料抓取失敗：網站已發布可用的舊資料，請檢查『讀取 objekt.top 及統計持有套數』紀錄。"
          exit 1
